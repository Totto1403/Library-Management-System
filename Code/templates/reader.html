{% extends "base.html" %}

{% block title %}Reading: {{ book.title }}{% endblock %}

{% block content %}
<!-- Reader Top Navigation & Controls -->
<div class="card border-0 shadow-sm rounded-4 p-3 mb-3 bg-white">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-3">
            <a href="{% if current_user.is_librarian %}{{ url_for('section_books', section_id=book.section_id) }}{% else %}{{ url_for('user_my_books') }}{% endif %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Shelf
            </a>
            <div>
                <h5 class="fw-bold text-dark mb-0">{{ book.title }}</h5>
                <small class="text-secondary"><i class="bi bi-person me-1"></i>{{ book.author }} &bull; {{ book.edition }} &bull; {{ book.section.name }}</small>
            </div>
        </div>
        <div class="d-flex gap-2">
            <a href="{{ url_for('download_pdf', book_id=book.id) }}" class="btn btn-primary btn-sm">
                <i class="bi bi-download me-1"></i> Download PDF
            </a>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="toggleFullScreen()">
                <i class="bi bi-arrows-fullscreen me-1"></i> Fullscreen
            </button>
        </div>
    </div>
</div>

<!-- Embedded PDF View Frame -->
<div class="card border-0 shadow-lg rounded-4 overflow-hidden" id="readerContainer">
    <iframe src="{{ url_for('view_pdf', book_id=book.id, raw='true') }}#toolbar=1&navpanes=1&scrollbar=1" class="reader-frame-container" title="PDF Document Viewer">
        <p>Your browser does not support inline PDF viewing. <a href="{{ url_for('download_pdf', book_id=book.id) }}">Download the eBook PDF directly</a>.</p>
    </iframe>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function toggleFullScreen() {
    const el = document.getElementById('readerContainer');
    if (!document.fullscreenElement) {
        el.requestFullscreen().catch(err => {
            alert(`Error attempting to enable full-screen mode: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
}
</script>
{% endblock %}
