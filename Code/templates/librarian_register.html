{% extends "base.html" %}

{% block title %}Add Librarian Administrator{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-5 col-md-7">
        <div class="card border rounded-3 p-4 p-md-5" style="border-color: var(--border-hairline) !important;">
            <!-- Clean Notion Header -->
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-secondary fs-2 mb-2 d-inline-block"></i>
                <h2 class="notion-h2 mb-1">Create Librarian Administrator</h2>
                <p class="text-secondary small mb-0">Provision an authorized staff account with administrative privileges.</p>
            </div>

            <form method="post" action="{{ url_for('librarian_register') }}">
                <div class="mb-3">
                    <label for="full_name" class="form-label fw-semibold text-secondary small">Administrator Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. Dr. Ramesh Kumar" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-secondary small">Staff ID / Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="e.g. librarian2" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold text-secondary small">Staff Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="e.g. staff.library@iitm.ac.in">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Secure password" required>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <a href="{{ url_for('librarian_dashboard') }}" class="btn btn-outline-secondary w-50">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-notion-primary w-50">
                        <i class="bi bi-shield-plus me-1"></i> Create Admin
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
