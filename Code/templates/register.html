{% extends "base.html" %}

{% block title %}Student Registration - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-5 col-md-8">
        <div class="card border rounded-3 p-4 p-md-5" style="border-color: var(--border-hairline) !important;">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='IITM_logo.png') }}" alt="IIT Madras Logo" class="mb-2" style="height: 38px;">
                <h2 class="notion-h2 mb-1">Create student account</h2>
                <p class="text-secondary small mb-0">Join the IIT Madras Digital Library portal</p>
            </div>

            <form method="post" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="full_name" class="form-label text-secondary small fw-medium mb-1">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. John Doe" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small fw-medium mb-1">Roll Number / Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="e.g. 22f2000805" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-secondary small fw-medium mb-1">IITM Student Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="e.g. 22f2000805@study.iitm.ac.in">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-secondary small fw-medium mb-1">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="At least 4 characters" required>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-secondary small fw-medium mb-1">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn btn-notion-primary w-100 mb-3">
                    Register Student Account
                </button>
            </form>

            <div class="text-center small text-secondary">
                Already registered? 
                <a href="{{ url_for('login', role='user') }}" class="text-primary fw-medium text-decoration-none">
                    Sign In here &rarr;
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
