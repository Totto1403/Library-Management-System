{% extends "base.html" %}

{% block title %}Sign In - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-5 col-md-8">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <!-- Header Banner -->
            <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, #0b2545 0%, #134074 100%); border-bottom: 3px solid var(--accent-gold);">
                <img src="{{ url_for('static', filename='IITM_logo.png') }}" alt="IIT Madras Logo" class="brand-logo mb-3" style="height: 52px; background: #fff; padding: 4px 8px; border-radius: 8px;">
                <h3 class="fw-bold mb-1">Library Portal Sign In</h3>
                <p class="small text-light mb-0" style="opacity: 0.85;">Indian Institute of Technology Madras</p>
            </div>

            <div class="p-4 p-md-5 bg-white">
                <!-- Role Selection Tabs -->
                <ul class="nav nav-pills nav-fill mb-4 p-1 rounded-3 bg-light border" id="loginRoleTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link {% if active_tab != 'librarian' %}active fw-bold{% endif %} py-2" id="user-tab" type="button" onclick="setRole('user')">
                            <i class="bi bi-mortarboard-fill me-1"></i> Student User
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link {% if active_tab == 'librarian' %}active fw-bold{% endif %} py-2" id="librarian-tab" type="button" onclick="setRole('librarian')">
                            <i class="bi bi-shield-lock-fill me-1"></i> Librarian
                        </button>
                    </li>
                </ul>

                <form method="post" action="{{ url_for('login') }}" id="loginForm">
                    <input type="hidden" name="role" id="selectedRole" value="{{ active_tab if active_tab == 'librarian' else 'user' }}">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-secondary small">Username / Student ID</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label fw-semibold text-secondary small mb-1">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter password" required>
                            <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePasswordVisibility()">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Library
                    </button>
                </form>

                <!-- Quick Demo Fill Pills for Evaluator -->
                <div class="p-3 bg-light rounded-3 border mb-4">
                    <div class="small fw-bold text-secondary mb-2">
                        <i class="bi bi-lightning-charge-fill text-warning me-1"></i>Quick Demo Auto-Fill:
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillCredentials('Totto', '1403', 'user')">
                            Student: Totto
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillCredentials('student1', 'student123', 'user')">
                            Student: student1
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-dark" onclick="fillCredentials('librarian', 'password', 'librarian')">
                            Librarian: Chief
                        </button>
                    </div>
                </div>

                <div class="text-center small text-secondary">
                    Don't have a student account? 
                    <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">
                        Register here
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function setRole(role) {
    document.getElementById('selectedRole').value = role;
    if (role === 'user') {
        document.getElementById('user-tab').classList.add('active', 'fw-bold');
        document.getElementById('librarian-tab').classList.remove('active', 'fw-bold');
    } else {
        document.getElementById('librarian-tab').classList.add('active', 'fw-bold');
        document.getElementById('user-tab').classList.remove('active', 'fw-bold');
    }
}

function fillCredentials(u, p, role) {
    setRole(role);
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}

function togglePasswordVisibility() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        pwd.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>
{% endblock %}
