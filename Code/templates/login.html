{% extends "base.html" %}

{% block title %}Sign In - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-5 col-md-8">
        <div class="card border rounded-3 p-4 p-md-5" style="border-color: var(--border-hairline) !important;">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='IITM_logo.png') }}" alt="IIT Madras Logo" class="mb-2" style="height: 38px;">
                <h2 class="notion-h2 mb-1">Sign in</h2>
                <p class="text-secondary small mb-0">IIT Madras Digital Library Management System</p>
            </div>

            <!-- Role Selection Tabs -->
            <ul class="nav nav-pills nav-fill mb-4 p-1 rounded-2" style="background-color: var(--bg-input);" id="loginRoleTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link {% if active_tab != 'librarian' %}active{% endif %}" id="user-tab" type="button" onclick="setRole('user')">
                        Student User
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link {% if active_tab == 'librarian' %}active{% endif %}" id="librarian-tab" type="button" onclick="setRole('librarian')">
                        Librarian
                    </button>
                </li>
            </ul>

            <form method="post" action="{{ url_for('login') }}" id="loginForm">
                <input type="hidden" name="role" id="selectedRole" value="{{ active_tab if active_tab == 'librarian' else 'user' }}">
                
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small fw-medium mb-1">Username / Student ID</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-secondary small fw-medium mb-1">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        <button class="btn btn-ghost" type="button" onclick="togglePasswordVisibility()" style="border: 1px solid var(--border-hairline) !important; border-left: none !important;">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-notion-primary w-100 mb-3">
                    Sign in
                </button>
            </form>

                <!-- Quick Demo Fill Pills for Evaluator -->
                <div class="notion-box p-3 mb-4">
                    <div class="text-secondary small fw-medium mb-2">
                        Quick Demo Auto-Fill:
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-notion-secondary btn-sm" onclick="fillCredentials('Totto', '1403', 'user')">
                            Student: Totto
                        </button>
                        <button type="button" class="btn btn-notion-secondary btn-sm" onclick="fillCredentials('student1', 'student123', 'user')">
                            Student: student1
                        </button>
                        <button type="button" class="btn btn-notion-secondary btn-sm" onclick="fillCredentials('librarian', 'password', 'librarian')">
                            Librarian: Chief
                        </button>
                    </div>
                </div>

                <div class="text-center small text-secondary">
                    Don't have a student account? 
                    <a href="{{ url_for('register') }}" class="text-primary fw-medium text-decoration-none">
                        Register here &rarr;
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function setRole(role) {
    document.getElementById('selectedRole').value = role;
    if (role === 'user') {
        document.getElementById('user-tab').classList.add('active', 'fw-bold');
        document.getElementById('librarian-tab').classList.remove('active', 'fw-bold');
    } else {
        document.getElementById('librarian-tab').classList.add('active', 'fw-bold');
        document.getElementById('user-tab').classList.remove('active', 'fw-bold');
    }
}

function fillCredentials(u, p, role) {
    setRole(role);
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}

function togglePasswordVisibility() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        pwd.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>
{% endblock %}
