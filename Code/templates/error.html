{% extends "base.html" %}

{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-6 text-center">
        <div class="card border-0 shadow-lg rounded-4 p-5 bg-white">
            <div class="display-1 fw-bold text-danger mb-3">{{ code }}</div>
            <h3 class="fw-bold text-dark mb-2">Oops! Something went wrong</h3>
            <p class="text-secondary lead mb-4" style="font-size: 1rem;">{{ message }}</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('home') }}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-1"></i> Return Home
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
