{% extends "base.html" %}

{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-6 text-center">
        <div class="card border rounded-3 p-5" style="border-color: var(--border-hairline) !important;">
            <div class="display-3 fw-semibold text-danger mb-3 tabular-nums">{{ code }}</div>
            <h2 class="notion-h2 mb-2">Something went wrong</h2>
            <p class="text-secondary mb-4" style="font-size: 15px;">{{ message }}</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('home') }}" class="btn btn-notion-primary px-3">
                    <i class="bi bi-house me-1"></i> Return Home
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
